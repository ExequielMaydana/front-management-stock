<mat-card class="sales-card">
    <div class="sales-content">
      <mat-icon class="sales-icon" aria-hidden="false" aria-label="Sales icon">point_of_sale</mat-icon>
      <div class="sales-info">
        <span class="sales-title">Ventas del día</span>
        <span class="sales-value">ARS ${{ salesAmount || 0 }}</span>
        <span class="sales-sub">({{ salesCount }} ventas)</span>
      </div>
    </div>
  </mat-card>
