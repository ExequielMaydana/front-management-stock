<mat-card class="table-card">
    <div class="table-title">📦 Productos con bajo stock</div>
  
    <table mat-table [dataSource]="lowStockData" class="mat-elevation-z1">
  
      <!-- Nombre -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Nombre </th>
        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
      </ng-container>
  
      <!-- Stock actual -->
      <ng-container matColumnDef="stock">
        <th mat-header-cell *matHeaderCellDef> Stock actual </th>
        <td mat-cell *matCellDef="let element"> {{element.stock}} </td>
      </ng-container>
  
      <!-- Proveedor -->
      <ng-container matColumnDef="supplier">
        <th mat-header-cell *matHeaderCellDef> Proveedor </th>
        <td mat-cell *matCellDef="let element"> {{element.supplier}} </td>
      </ng-container>
  
      <!-- Costo unitario -->
      <ng-container matColumnDef="unitCost">
        <th mat-header-cell *matHeaderCellDef> Costo unitario </th>
        <td mat-cell *matCellDef="let element"> {{element.unitCost}} </td>
      </ng-container>
  
      <!-- Último ingreso -->
      <ng-container matColumnDef="lastRestock">
        <th mat-header-cell *matHeaderCellDef> Último ingreso </th>
        <td mat-cell *matCellDef="let element"> {{element.lastRestock}} </td>
      </ng-container>
  
      <!-- Stock mínimo sugerido -->
      <ng-container matColumnDef="minStock">
        <th mat-header-cell *matHeaderCellDef> Mín. sugerido </th>
        <td mat-cell *matCellDef="let element"> {{element.minStock}} </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card>
